<!-- Checkout is the one page that can load a third-party script (Paystack Inline
     JS, when the owner switches payment.provider to 'paystack'); this pins
     script-src to that one known host + the page's own known inline snippet
     (by hash, since a static site has no per-request nonce to issue) so a
     compromised/rewritten third-party response can't run arbitrary script here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-+i6XpyNpu+XQovUjYyaiqo8r4WKB+csly5JfkGt1iDk=' https://js.paystack.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://checkout.paystack.com https://js.paystack.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('ka_theme') || 'dark');</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="checkout.css">
</head>

    </div>
  </section>

  <section class="co-section-wrap">

      <div id="checkoutRoot"><!-- rendered by checkout.js --></div>
      <div class="sr-only" id="coStatusLive" role="status" aria-live="polite"></div>

</div>
